type Order {
  id: String
  userId: String
  soldToId: String
  sapOrderNumber: String
  shipToAddress: String
  createdDate: String
  poNumber: String
  skuNumber: String
  brand: String
}

type Pagination {
  pageSize: Int
  page: Int
  total: Int
}

type OrdersList {
  items: [Order]
  pagination: Pagination
}

input FilterDates {
  from: String
  to: String
}

input SearchOptions {
  dateRange: FilterDates
  searchQuery: String
  brand: String
  soldToId: String
  userId: String
}

input SortOptions {
  field: String
  order: String
}

input OrderDataInput {
  id: String
  userId: String
  soldToId: String
  sapOrderNumber: String
  shipToAddress: String
  createdDate: String
  poNumber: String
  skuNumber: String
  brand: String
}

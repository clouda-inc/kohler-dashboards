query getOrders($searchOptions: SearchOptions, $sort: SortOptions, $page: Int, $pageSize: Int) {
  getOrders(searchOptions: $searchOptions, sort: $sort, page: $page, pageSize: $pageSize){
    items {
			id
      poNumber
      sapOrderNumber
			skuNumber
      shipToAddress
      createdDate
      brand
    }
    pagination {
      page
      pageSize
      total
    }
  }
}
